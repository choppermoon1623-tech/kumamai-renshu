<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>熊舞 練習ビューア（第19代引継式 2023.2.25）</title>
<style>
:root{
  --bg:#1b1a17; --panel:#262420; --line:#3a3730; --ink:#f3efe6; --sub:#b9b2a3;
  --onna:#ff8fb1; --otoko:#7fb8ff; --kari:#8fdc8f; --key:#ffe066; --accent:#e9a13b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif}
button{font:inherit;color:inherit;background:#34312b;border:1px solid #4a463d;border-radius:8px;
  padding:6px 12px;cursor:pointer}
button:hover{background:#3f3b33}
button.on{background:var(--accent);color:#1b1a17;border-color:var(--accent);font-weight:bold}
.app{display:grid;grid-template-columns:minmax(0,1fr) 440px;grid-template-rows:auto minmax(0,1fr) auto;
  height:100vh;gap:0}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;font-weight:bold}
header .src{color:var(--sub);font-size:13px}
header .sp{flex:1}
header a{color:var(--sub);font-size:13px}

/* 動画側 */
.stage{display:flex;flex-direction:column;min-height:0;padding:10px 12px 6px}
.vwrap{position:relative;flex:1;min-height:0;background:#000;border-radius:8px;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
video{max-width:100%;max-height:100%;display:block}
video.mirror{transform:scaleX(-1)}
.badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);padding:6px 12px;border-radius:8px;
  font-size:22px;font-weight:bold;pointer-events:none}
.badge small{font-size:14px;color:var(--sub);font-weight:normal;margin-left:8px}
.mirrorTag{position:absolute;right:10px;top:10px;background:var(--accent);color:#1b1a17;padding:3px 10px;
  border-radius:6px;font-weight:bold;font-size:14px;display:none}
.vwrap.isMirror .mirrorTag{display:block}
.err{color:#ffb4a0;padding:20px;line-height:1.7;display:none}

.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:8px}
.ctrl .grp{display:flex;gap:4px;align-items:center;margin-right:10px}
.ctrl .lbl{color:var(--sub);font-size:13px;margin-right:2px}
.ctrl .time{font-variant-numeric:tabular-nums;font-size:18px;min-width:120px}
#play{min-width:90px;font-weight:bold}

/* 場面バー */
.bar{grid-column:1/3;padding:6px 12px 10px;border-top:1px solid var(--line)}
.track{position:relative;height:34px;background:#2e2b25;border-radius:6px;overflow:hidden;cursor:pointer}
.seg{position:absolute;top:0;bottom:0;border-right:1px solid #1b1a17;display:flex;align-items:center;
  justify-content:center;font-size:12px;color:#d8d0bf;background:#3a362e}
.seg.alt{background:#433e35}
.seg.cur{background:var(--accent);color:#1b1a17;font-weight:bold}
.seg.out{background:#24221e;color:#7d776a}
.head{position:absolute;top:0;bottom:0;width:3px;background:#fff;pointer-events:none}

/* 右パネル */
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:6px;padding:10px 12px 6px}
.legend{display:flex;gap:12px;padding:0 14px 6px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.legend b{font-weight:bold}
.scroll{overflow:auto;flex:1;padding:0 12px 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px}
.card.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(233,161,59,.35)}
.card h2{margin:0 0 8px;font-size:22px;display:flex;align-items:baseline;gap:10px}
.card h2 .t{font-size:15px;color:var(--accent);font-weight:normal}
.card h2 .call{font-size:15px;color:var(--key)}
.card h2 button{margin-left:auto;font-size:13px;padding:3px 10px}
.card img{width:100%;background:#fff;border-radius:6px;display:block}
.steps{list-style:none;padding:0;margin:10px 0 0}
.steps li{font-size:19px;line-height:1.5;padding:3px 6px;border-radius:5px}
.steps li.key{background:rgba(255,224,102,.16);box-shadow:inset 3px 0 0 var(--key)}
.music{margin-top:10px;border-top:1px dashed #4a463d;padding-top:8px;font-size:15px;line-height:1.6;color:#e6dfd0}
.music .who{display:inline-block;min-width:4.2em;color:var(--sub)}
.music .k{background:rgba(255,224,102,.22);padding:0 3px;border-radius:3px}
.note{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.6}
.r-onna{color:var(--onna);font-weight:bold}
.r-otoko{color:var(--otoko);font-weight:bold}
.r-kari{color:var(--kari);font-weight:bold}
.next{margin-top:10px;font-size:14px;color:var(--sub)}
.next b{color:var(--ink)}
.help{font-size:12.5px;color:var(--sub);padding:6px 14px 10px;line-height:1.7;border-top:1px solid var(--line)}
kbd{background:#34312b;border:1px solid #4a463d;border-radius:4px;padding:0 5px;font-size:12px;color:var(--ink)}

/* 見せ方の切りかえ・アニメ */
.viewbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:8px}
.viewbar .grp{display:flex;gap:4px;align-items:center;margin-right:12px}
.viewbar .lbl{color:var(--sub);font-size:13px;margin-right:2px}
.viewbar button{padding:4px 10px;font-size:14px}
.views{flex:1;min-height:0;display:flex;gap:8px}
.views .vwrap{flex:1}
.anim{flex:1;min-width:0;min-height:0;display:none;flex-direction:column;background:#11100e;border-radius:8px;
  padding:6px;position:relative;overflow:hidden}
.views.v-both .anim,.views.v-anim .anim{display:flex}
.views.v-anim .vwrap{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.anim svg{width:100%;display:block;min-height:0}
#map{flex:1.7 1 0}
#fig{flex:1 1 0;background:linear-gradient(#2a251e,#5a4a36);border-radius:6px}
.cap{font-size:17px;line-height:1.5;padding:4px 8px 2px;min-height:3.2em}
.cap .who{display:inline-block;min-width:3.6em;font-weight:bold}
.cap .nx{color:var(--sub);font-size:14px}
.cap .cd{color:var(--accent);font-variant-numeric:tabular-nums}
.cap .dim{color:#77715f}
.views.v-anim .cap{font-size:21px}

/* 鳴り物 */
.lane{position:relative;height:16px;margin-top:4px;background:#2a2722;border-radius:4px;overflow:hidden;cursor:pointer}
.lane .nb{position:absolute;top:0;bottom:0}
.nari{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.72);border-radius:8px;padding:6px 10px;
  font-size:15px;line-height:1.45;pointer-events:none;max-width:calc(100% - 20px)}
.nari .now{font-size:19px;font-weight:bold}
.nari .chip{display:inline-block;padding:0 7px;border-radius:5px;color:#111;font-weight:bold}
.nari .soon{color:#ffe9a8}
.nari.flash{animation:fl .5s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 6px #fff}100%{box-shadow:0 0 0 0 transparent}}
.nari.hidden{display:none}
.anim .nari{position:static;margin:2px 4px 0;background:#1f1d19}
.views.v-both .vwrap .nari{display:none}
.quiz{display:none;position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:20;background:#262420;
  border:2px solid var(--accent);border-radius:14px;padding:18px 20px;width:min(720px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.6)}
.quiz.show{display:block}
.quiz h3{margin:0 0 6px;font-size:22px}
.quiz .hint{color:var(--sub);margin-bottom:12px;line-height:1.6}
.quiz .ch{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.quiz .ch button{text-align:left;padding:10px 12px;font-size:16px;border-left-width:8px}
.quiz .res{margin-top:12px;font-size:18px;line-height:1.6}
.quiz .ok{color:#8fdc8f;font-weight:bold}.quiz .ng{color:#ff8f8f;font-weight:bold}
.tpad{display:none;position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:19;background:rgba(30,28,24,.95);
  border:2px solid var(--accent);border-radius:12px;padding:10px;gap:6px;flex-wrap:wrap;justify-content:center;width:min(980px,96vw)}
.tpad.show{display:flex}
.tpad button{font-size:16px;padding:10px 12px;border-bottom-width:6px}
.tpad .msg{width:100%;text-align:center;font-size:18px;min-height:1.5em}
.tpad .stopb{background:#5a2a2a}
.ncard{display:grid;grid-template-columns:16px 1fr;gap:4px 10px;align-items:start;padding:7px 0;border-bottom:1px dashed #3d3a33}
.ncard .sw{width:16px;height:100%;min-height:36px;border-radius:4px}
.ncard b{font-size:16px}
.ncard .when{color:#e6dfd0;font-size:14px;line-height:1.55}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;margin:8px 0 2px}
.chain span{padding:3px 8px;border-radius:6px;color:#111;font-weight:bold}
.qbtns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.qbtns button{font-size:14px}
.score{font-size:15px;line-height:1.7;background:#1f1d19;border-radius:8px;padding:8px 10px;margin-top:6px}
table.cues{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.cues td{padding:4px 4px;border-bottom:1px solid #34312b;vertical-align:top}
table.cues tr{cursor:pointer}
table.cues tr:hover{background:#2f2c26}
table.cues tr.cur{background:rgba(233,161,59,.18)}
table.cues .tt{font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
.steps li.now{outline:2px solid #fff;outline-offset:-2px}

/* 印刷（一覧表示を紙に） */
@media print{
  body{background:#fff;color:#000}
  header,.stage,.bar,.tabs,.legend,.help,.card h2 button{display:none!important}
  .app{display:block;height:auto}
  aside{border:0}
  .scroll{overflow:visible}
  .card{background:#fff;border:1px solid #999;break-inside:avoid;color:#000}
  .music{color:#000}
  .r-onna{color:#c2185b}.r-otoko{color:#1565c0}.r-kari{color:#2e7d32}
}
@media (max-width:1000px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;height:auto}
  header,.bar{grid-column:1}
  .vwrap{height:56vw}
  aside{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>熊舞 練習ビューア</h1>
    <span class="src">第19代引継式（2023.2.25）の動画 × 動きの表（場面1〜28）</span>
    <span class="sp"></span>
    <a href="熊舞_動き表.pdf" target="_blank">元の動き表（PDF）</a>
  </header>

  <section class="stage">
    <div class="viewbar">
      <div class="grp"><span class="lbl">見せ方</span>
        <button data-view="video">動画</button><button data-view="both" class="on">並べる</button><button data-view="anim">アニメ</button>
      </div>
      <div class="grp"><span class="lbl">アニメ</span>
        <button data-ver="kuma" class="on">🐻 熊版</button><button data-ver="kari">🏹 狩人版</button>
      </div>
      <div class="grp"><span class="lbl">図の向き</span>
        <button data-ori="zu" class="on" title="動き表の図と同じ（上が客席）">動き表と同じ</button><button data-ori="cam" title="動画と同じ（客席から見た向き）">動画と同じ</button>
      </div>
    </div>
    <div class="views" id="views">
    <div class="vwrap" id="vwrap">
      <video id="v" src="kumamai.mp4" preload="auto" playsinline></video>
      <div class="badge" id="badge">—</div>
      <div class="mirrorTag">鏡モード（左右反転）</div>
      <div class="err" id="err">動画（kumamai.mp4）が読み込めません。<br>この index.html と同じフォルダに kumamai.mp4 があるか確かめてください。</div>
      <div class="nari" id="nariV"></div>
    </div>
    <div class="anim" id="anim">
      <svg id="map" viewBox="0 0 1000 540" preserveAspectRatio="xMidYMid meet"></svg>
      <svg id="fig" viewBox="0 0 1000 310" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="cap" id="cap"></div>
      <div class="nari" id="nariA"></div>
    </div>
    </div>
    <div class="quiz" id="quiz"></div>
    <div class="tpad" id="tpad"></div>
    <div class="ctrl">
      <div class="grp">
        <button id="prev" title="前の場面（↑）">◀ 場面</button>
        <button id="back" title="5秒もどる（←）">↶ 5秒</button>
        <button id="play" title="再生／一時停止（スペース）">▶ 再生</button>
        <button id="fwd" title="5秒すすむ（→）">5秒 ↷</button>
        <button id="next" title="次の場面（↓）">場面 ▶</button>
      </div>
      <div class="grp"><span class="time" id="time">0:00</span></div>
      <div class="grp"><span class="lbl">速さ</span>
        <button data-rate="0.5">0.5</button><button data-rate="0.75">0.75</button><button data-rate="1" class="on">1</button>
      </div>
      <div class="grp">
        <button id="loop" title="今の場面だけをくり返す（L）">🔁 場面くり返し</button>
        <button id="stop" title="場面の終わりで一時停止（S）">⏸ 場面ごとに止める</button>
        <button id="mirror" title="左右反転（M）">↔ 鏡</button>
      </div>
    </div>
  </section>

  <aside>
    <div class="tabs">
      <button id="tabNow" class="on">いまの場面</button>
      <button id="tabAll">ぜんぶの場面</button>
      <button id="tabNari">🥁 鳴り物</button>
      <button id="printBtn" title="ぜんぶの場面を紙に印刷">印刷</button>
    </div>
    <div class="legend">
      <span><b class="r-onna">♀ 女熊</b></span><span><b class="r-otoko">♂ 男熊</b></span><span><b class="r-kari">狩 狩人</b></span>
      <span><span style="background:rgba(255,224,102,.25);padding:0 4px">黄色</span>＝きっかけ・大事なところ</span>
    </div>
    <div class="scroll" id="panel"></div>
    <div class="help">
      <kbd>スペース</kbd> 再生/停止　<kbd>←</kbd><kbd>→</kbd> 5秒　<kbd>↑</kbd><kbd>↓</kbd> 前/次の場面　<kbd>L</kbd> くり返し　<kbd>S</kbd> 場面ごとに止める　<kbd>M</kbd> 鏡　<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 速さ<br>
      鏡モード：動画の人と向かい合って同じ向きにまねするとき用。図は反転しません。
    </div>
  </aside>

  <div class="bar">
    <div class="track" id="track"><div class="head" id="head"></div></div>
    <div class="lane" id="lane" title="鳴り物（色＝通常ではない所）"><div class="head" id="head2"></div></div>
  </div>
</div>

<script>
// 動画ファイルは元動画の 5:55〜19:42 を切り出してある。表示する時刻は元動画（＝動き表）の時刻。
const OFFSET = 355;          // 5:55
const CLIP_END = 355 + 827;  // 19:42（熊が客席へ向かう所で終わり）

// 動き表（22.pdf）の書き起こし。先頭が「!」の行＝動き表で黄色く塗ってある所。
// music の中の [ ] ＝黄色く塗ってある所。
const S = [
 {n:1, t:"6:00", call:"どんどんドンカッ", steps:["①中央経由して右前方へ","②右前方で背伸び","③左前方で背伸び","④中央へ戻り伸びて、手ぬぐい"],
  music:[["楽器隊","通常のリズム"]]},
 {n:2, t:"7:05", steps:["①右へかき分け耳","②左かき分け耳「おーい熊が出るぞ！」","③笛吹きながら出たところへ"],
  music:[["楽器隊","通常リズム"]]},
 {n:3, t:"8:00", steps:["①女熊から出ていく","②半分くらいで男熊GO"],
  music:[["楽器隊","どこどこどこ…＆ピロピロピロ"]]},
 {n:4, t:"9:05", call:"「せーの」", steps:["①そろったら、顔をグルんからカチカチ","!②顔戻してジャンプ","③後ろに３歩　←カッどんどんどん","④前、後ろ、前でジャンプ","⑤顔グルんからのカチカチ"],
  music:[["太鼓","どんどん[ドンカッから]通常"],["笛・鐘","ピロピロ…カッで通常"]]},
 {n:5, t:"9:24", steps:["①女熊から左回りに","②目の前通過したら後ろを男熊追いかけ","③１周して元の場所へ戻る"],
  music:[["楽器隊","通常"]]},
 {n:6, t:"9:53", steps:["①女熊は足かけてぴょんぴょん","①男熊は後ろの人が足で顔３回ける","②男熊しゃがみ女熊の方見る","③女熊２回けるふり、３回目こつん","④立って顔グルん","⑤ジャンプ内、外、内して外側へぐるり"],
  music:[["太鼓","ジャンプしたらドンドンドン[から、カッ！]その後、通常"]]},
 {n:7, t:"10:30", steps:["①男熊中央前方でしゃがみ（右向き）","②女熊右回りでそのクマの横へ","③この後男熊の上に女熊乗る","④上で口カチカチ"],
  music:[["太鼓","熊が乗る前から、ドンドンドン　[降りると同時にドン！からのカッ]"]]},
 {n:8, t:"10:56", steps:["①移動して","②寝る"],
  music:[["楽器隊","寝る前ゆっくり＆小さく"]]},
 {n:9, t:"11:32", steps:["①右へ出て　背伸びキョロ","②左へ行って　背伸びキョロ","③男熊へ向かう"],
  music:[["楽器隊","[どんどんドンカッから]通常"]]},
 {n:10, t:"12:28", steps:["①びっくりして逆いってびっくり","②真ん中で南無南無","③男熊の方見て、女熊の方見て"],
  music:[["楽器隊","通常"]]},
 {n:11, t:"12:39", steps:["①男熊の方に向かい","②顔の前で手を大きくフリフリ","!③叩くふり２回、３回目で熊の後ろトン","④熊バタバタ"],
  music:[["楽器隊","[熊叩いたらドコドコ、ピロピロ]"]]},
 {n:12, t:"12:55", steps:["①狩人中央へ戻り南無南無","!②太鼓のカッの後きょろきょろ","③懲りずに女熊へ","!④叩くふり２回、３回目で熊の後ろトン","⑤熊バタバタ"],
  music:[["楽器隊","[どんどんドンカッの後通常 →叩いたらまたドコピロ]"]]},
 {n:13, t:"13:21", steps:["①狩人中央へ戻り南無南無","!②カッの後きょろきょろ","③うーん、ポン","④寝てる寝てる（右、左）","⑤酒飲むー","⑥寝る"],
  music:[["楽器隊","[太鼓のカッ]の後通常 →寝る前ゆっくり＆小さく"]]},
 {n:14, t:"14:13", steps:["①太鼓に合わせて女熊立つ","!②女熊近づく","③３回チョン","④狩人やめーい","⑤細かく後ずさり　止まる","⑥横で座って３回目でえーい"],
  music:[["太鼓","小さくなってからドンドンドン（徐々に大きく）"],["楽器隊","[たったら足音に合わせて ピロロ ピロロ]"],["","③のところでドンドンドン　④で止まる　⑤でまたドンドンドン"]]},

const toSec = s => { const [m,x]=s.split(":").map(Number); return m*60+x; };
const fmt = sec => { sec=Math.max(0,Math.floor(sec)); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"); };

const esc = t => t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function roles(t){
  return esc(t)
    .replace(/女熊/g,'<span class="r-onna">女熊</span>')
    .replace(/男熊/g,'<span class="r-otoko">男熊</span>')
    .replace(/狩人/g,'<span class="r-kari">狩人</span>')
    .replace(/（女）/g,'（<span class="r-onna">女</span>）').replace(/（男）/g,'（<span class="r-otoko">男</span>）');
}
function musicHtml(m){
  return m.map(([who,txt])=>`<div><span class="who">${who||"楽器"}</span>${esc(txt).replace(/\[(.+?)\]/g,'<span class="k">$1</span>')}</div>`).join("");
}
function cardHtml(s, withNext){
  const steps = s.steps.map((x,k)=> x.startsWith("!") ? `<li data-i="${k}" class="key">${roles(x.slice(1))}</li>` : `<li data-i="${k}">${roles(x)}</li>`).join("");
  const nx = S[s.n]; // 次の場面
  return `<div class="card" id="c${s.n}">
    <h2>場面${s.n}<span class="t">${s.tGuess?"目安 ":""}${s.t}〜</span>${s.call?`<span class="call">${esc(s.call)}</span>`:""}
      <button data-go="${s.n}">ここから再生</button></h2>
    <img src="zu/zu${String(s.n).padStart(2,"0")}.png" alt="場面${s.n}の立ち位置図">
    <ul class="steps">${steps}</ul>
    <div class="music">${musicHtml(s.music)}</div>
    ${s.note?`<div class="note">※${s.note}</div>`:""}
    ${withNext && nx ? `<div class="next">つぎ → <b>場面${nx.n}</b>（${nx.t}）${roles(nx.steps[0].replace(/^!/,""))}</div>`:""}

const v = document.getElementById("v");
const panel = document.getElementById("panel");
let mode = "now", cur = -1, loop = false, stopEach = false;

// 場面バー
const track = document.getElementById("track"), head = document.getElementById("head");
const T0 = OFFSET, T1 = CLIP_END, span = T1-T0;
const pct = t => ((t-T0)/span*100)+"%";
function addSeg(a,b,label,cls,title){
  const d=document.createElement("div"); d.className="seg "+cls; d.style.left=pct(a); d.style.width=`calc(${pct(b)} - ${pct(a)})`;
  d.textContent=label; d.title=title; track.insertBefore(d,head); return d;
}
addSeg(T0,S[0].start,"前","out","はじまる前");
const segs = S.map((s,i)=>addSeg(s.start,s.end,s.n,i%2?"alt":"",`場面${s.n}（${s.t}〜）`));
if(T1-AFTER>1) addSeg(AFTER,T1,"その後","out","動き表にない部分");
track.addEventListener("click",e=>{
  const r=track.getBoundingClientRect(); seek(T0+(e.clientX-r.left)/r.width*span);
});

function sceneAt(t){ for(let i=S.length-1;i>=0;i--) if(t>=S[i].start) return t<S[i].end?i:-2; return -1; }
function seek(t){ v.currentTime = Math.min(Math.max(t,T0),T1-0.1)-OFFSET; }
function goScene(i, play=true){ i=Math.max(0,Math.min(S.length-1,i)); seek(S[i].start+0.05); if(play) v.play(); }

function render(){
  if(mode==="nari"){ if(window.renderNari) renderNari(); return; }
  if(mode==="all"){
    panel.innerHTML = S.map(s=>cardHtml(s,false)).join("");
  }else{
    panel.innerHTML = cur>=0 ? cardHtml(S[cur],true)
      : cur===-1 ? `<div class="card"><h2>はじまる前</h2><div class="note">6:00 から場面1。下の場面バーか「場面 ▶」で選べます。</div></div>`
      : `<div class="card"><h2>動き表のあと</h2><div class="note">19:42ごろから熊が客席へ。動画はここまでです。</div></div>`;
  }
  markCur();
}
function markCur(){
  segs.forEach((d,i)=>d.classList.toggle("cur",i===cur));
  panel.querySelectorAll(".card").forEach(c=>c.classList.toggle("cur",c.id==="c"+(cur+1)));
  if(mode==="all" && cur>=0){ const c=document.getElementById("c"+(cur+1)); c && c.scrollIntoView({block:"nearest",behavior:"smooth"}); }
}

const badge=document.getElementById("badge"), timeEl=document.getElementById("time");
let lastScene=null;
function tick(){
  const t = v.currentTime + OFFSET;
  head.style.left = pct(t);
  timeEl.textContent = fmt(t);
  // くり返し・場面ごとに止める
  if(lastScene!==null && lastScene>=0 && !v.paused){
    const s=S[lastScene];
    if(t>=s.end-0.05){
      if(loop){ seek(s.start+0.05); return; }
      if(stopEach){ v.pause(); seek(s.end-0.15); return; }
    }
  }
  const i = sceneAt(t);
  badge.innerHTML = i>=0 ? `場面${S[i].n}<small>${S[i].t}〜</small>` : (i===-1?"はじまる前":"動き表のあと");
  if(i!==cur){ cur=i; if(mode==="now") render(); else markCur(); }
  lastScene = i;
}
v.addEventListener("timeupdate",tick);
v.addEventListener("seeked",()=>{ lastScene=null; tick(); });
(function raf(){ if(!v.paused) tick(); requestAnimationFrame(raf); })();
v.addEventListener("play",()=>document.getElementById("play").textContent="⏸ 停止");
v.addEventListener("pause",()=>document.getElementById("play").textContent="▶ 再生");
v.addEventListener("error",()=>{ document.getElementById("err").style.display="block"; v.style.display="none"; });
// index.html#14 のように開くと、その場面から始まる
v.addEventListener("loadedmetadata",()=>{
  const h=parseInt(location.hash.slice(1),10);
  if(h>=1 && h<=S.length) seek(S[h-1].start+0.05);
  else if(v.currentTime<1) seek(S[0].start-5);
});

const playPause=()=> v.paused?v.play():v.pause();
document.getElementById("play").onclick=playPause;
document.getElementById("back").onclick=()=>seek(v.currentTime+OFFSET-5);
document.getElementById("fwd").onclick=()=>seek(v.currentTime+OFFSET+5);
document.getElementById("prev").onclick=()=>goScene(cur>=0?cur-1:(cur===-2?S.length-1:0));
document.getElementById("next").onclick=()=>goScene(cur>=0?cur+1:(cur===-1?0:S.length-1));
function setRate(r){ v.playbackRate=r; document.querySelectorAll("[data-rate]").forEach(b=>b.classList.toggle("on",+b.dataset.rate===r)); }
document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>setRate(+b.dataset.rate));
const loopBtn=document.getElementById("loop"), stopBtn=document.getElementById("stop"), mirBtn=document.getElementById("mirror");
function toggleLoop(){ loop=!loop; if(loop){stopEach=false;stopBtn.classList.remove("on");} loopBtn.classList.toggle("on",loop); }
function toggleStop(){ stopEach=!stopEach; if(stopEach){loop=false;loopBtn.classList.remove("on");} stopBtn.classList.toggle("on",stopEach); }
function toggleMirror(){ v.classList.toggle("mirror"); const on=v.classList.contains("mirror");
  mirBtn.classList.toggle("on",on); document.getElementById("vwrap").classList.toggle("isMirror",on); }
loopBtn.onclick=toggleLoop; stopBtn.onclick=toggleStop; mirBtn.onclick=toggleMirror;

const tabNow=document.getElementById("tabNow"), tabAll=document.getElementById("tabAll");
const tabNari=document.getElementById("tabNari");
function setTab(m){ mode=m; tabNow.classList.toggle("on",m==="now"); tabAll.classList.toggle("on",m==="all"); tabNari.classList.toggle("on",m==="nari"); render(); }
tabNow.onclick=()=>setTab("now");
tabAll.onclick=()=>setTab("all");
tabNari.onclick=()=>setTab("nari");
document.getElementById("printBtn").onclick=()=>{ if(mode==="now") setTab("all"); setTimeout(()=>window.print(),300); };
panel.addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b) goScene(+b.dataset.go-1); });

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  const k=e.key;
  if(k===" "){ e.preventDefault(); playPause(); }
  else if(k==="ArrowLeft"){ e.preventDefault(); seek(v.currentTime+OFFSET-5); }
  else if(k==="ArrowRight"){ e.preventDefault(); seek(v.currentTime+OFFSET+5); }
  else if(k==="ArrowUp"||k==="PageUp"){ e.preventDefault(); document.getElementById("prev").onclick(); }
  else if(k==="ArrowDown"||k==="PageDown"){ e.preventDefault(); document.getElementById("next").onclick(); }
  else if(k==="l"||k==="L") toggleLoop();
  else if(k==="s"||k==="S") toggleStop();
  else if(k==="m"||k==="M") toggleMirror();
  else if(k==="1") setRate(0.5); else if(k==="2") setRate(0.75); else if(k==="3") setRate(1);
});
render();
</script>

const ACT={};
for(const id of ["H","F","M"]){
  const pos=[],pose=[];
  for(const e of KF[id]){
    const t=T(e[0]);
    if(e.length===2) pose.push({t,p:e[1]});
    else { pos.push({t,x:e[1],y:e[2]}); if(e.length===4) pose.push({t,p:e[3]}); }
  }
  pos.sort((a,b)=>a.t-b.t); pose.sort((a,b)=>a.t-b.t);
  ACT[id]={pos,pose,face:id==="M"?1:-1};
}
function posAt(id,t){
  const P=ACT[id].pos;
  if(t<=P[0].t) return {x:P[0].x,y:P[0].y,dx:0,dy:0,mv:false};
  for(let i=1;i<P.length;i++) if(t<P[i].t){
    const a=P[i-1],b=P[i],k=(t-a.t)/(b.t-a.t),dx=b.x-a.x,dy=b.y-a.y;
    return {x:a.x+dx*k,y:a.y+dy*k,dx,dy,mv:Math.hypot(dx,dy)>0.5};
  }
  const L=P[P.length-1]; return {x:L.x,y:L.y,dx:0,dy:0,mv:false};
}
function poseAt(id,t){
  const P=ACT[id].pose; let r={p:"hide",t0:0};
  for(const e of P){ if(e.t<=t) r={p:e.p,t0:e.t}; else break; }
  return r;
}

    s+=`<g transform="translate(0,-26) scale(1,${f1(p.sc)}) translate(0,26)">`;
    s+=`<polygon points="${fuzz(0,-102,54,80,44,.08,1)}" fill="#171717" stroke="#3a3a3a" stroke-width="2"/>`;
    for(const [sx,a,sg] of [[-46,p.al,1],[46,p.ar,-1]]){ const [hx,hy]=seg(sx,-138,sg*a,44);
      s+=`<line x1="${sx}" y1="-138" x2="${f1(hx)}" y2="${f1(hy)}" stroke="#171717" stroke-width="22" stroke-linecap="round"/>`; }
    s+=`<ellipse cx="0" cy="-150" rx="34" ry="7" fill="${accent}" opacity=".9"/>`;
    s+=`<g transform="translate(0,${f1(p.nod)}) rotate(${f1(p.hr)} 0 -190)">${bearHead(p)}</g></g>`;
    return {svg:`<g transform="translate(0,${f1(p.y)}) rotate(${f1(p.rot)} 0 -60)">${s}</g>`,top:-246*p.sc,bub:p.bub};
  }
  // 横向き（右向きで描いて、向きは外で反転）
  if(!p.tuck) for(const [x,a] of [[-58,p.sw],[-32,-p.sw],[36,-p.sw],[62,p.sw]]){
    const [fx,fy]=seg(x,-48,a,46); s+=`<line x1="${x}" y1="-48" x2="${f1(fx)}" y2="${f1(fy)}" stroke="#141414" stroke-width="20" stroke-linecap="round"/>`; }
  s+=`<g transform="translate(0,${f1(p.y)}) scale(1,${f1(p.sc)})">`;
  s+=`<polygon points="${fuzz(0,-80,94,46,40,.09,2)}" fill="#171717" stroke="#3a3a3a" stroke-width="2"/>`;
  s+=`<ellipse cx="74" cy="-82" rx="8" ry="30" fill="${accent}" opacity=".9"/>`;
  s+=`<g transform="rotate(${f1(p.hd)} 80 -84) translate(98,106) scale(.82)">${bearHead(p)}</g></g>`;
  return {svg:`<g transform="rotate(${f1(p.rot)} 0 -70)">${s}</g>`,top:-150*p.sc,bub:p.bub,side:1};
}

// ---- 表示の状態 ----
let ver="kuma", ori="zu", view="both";
const focusOf=id=> ver==="kuma" ? (id!=="H") : (id==="H");
const mapEl=document.getElementById("map"), figEl=document.getElementById("fig"), capEl=document.getElementById("cap");
const OX=40,OY=52,SX=9.2,SY=8.8;
function disp(x,y){ if(ori==="cam"){x=100-x;y=50-y;} return [OX+x*SX,OY+y*SY]; }

function actorState(id,t){
  const P=poseAt(id,t); if(P.p==="hide") return null;
  const q=posAt(id,t); let p=P.p;
  if(q.mv){ if(p==="stand") p=(id==="H"?"walk":"walk"); else if(p==="stand4") p="walk4"; }
  const [X,Y]=disp(q.x,q.y);
  let dX=q.dx*(ori==="cam"?-1:1);
  if(q.mv && ab(dX)>0.3) ACT[id].face=dX>0?1:-1;
  return {id,p,u:t-P.t0,x:q.x,y:q.y,X,Y,mv:q.mv};
}

function sceneSteps(s,t){ // 今やっている番号（ver で絞る）と次
  const want=w=> w.includes("A") || (ver==="kuma" ? /[FMB]/.test(w) : w.includes("H"));
  let curK=[],nextK=null,lastT=-1;
  s.st.forEach((e,k)=>{ if(!want(e.w)) return; if(e.t<=t+0.05){ if(e.t>lastT+0.01){curK=[k];lastT=e.t;} else curK.push(k);} else if(nextK===null) nextK=k; });
  return {curK,nextK};
}
function allCurSteps(s,t){ let r=[],lt=-1; s.st.forEach((e,k)=>{ if(e.t<=t+0.05){ if(e.t>lt+0.01){r=[k];lt=e.t;} else r.push(k);} }); return r; }

function drawMap(t,A){
  let s=`<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>`;
  s+=`<rect x="${OX}" y="${OY}" width="${100*SX}" height="${50*SY}" rx="14" fill="#2a251d" stroke="#5a5040" stroke-width="2"/>`;
  s+=`<line x1="${OX+50*SX}" y1="${OY}" x2="${OX+50*SX}" y2="${OY+50*SY}" stroke="#4a4234" stroke-dasharray="6 8"/>`;
  const front = ori==="zu" ? "top" : "bottom";
  const ty = OY-14, by = OY+50*SY+30;
  const drumsY = front==="top" ? OY+50*SY+12 : OY-12;
  for(const dx of [300,500,700]) s+=`<circle cx="${dx}" cy="${drumsY}" r="9" fill="#7a5a3a" stroke="#c9a46a"/>`;
  s+=`<text x="500" y="${front==="top"?ty:by}" fill="#e9a13b" font-size="20" text-anchor="middle" font-weight="bold">▲ 客席（前）${ori==="cam"?"＝カメラ側":""}</text>`;
  s+=`<text x="150" y="${front==="top"?by:ty}" fill="#b9b2a3" font-size="18" text-anchor="middle">楽器隊（うしろ）</text>`;
  const L = ori==="zu" ? "演者の左" : "演者の右", R = ori==="zu" ? "演者の右" : "演者の左";
  s+=`<text x="${OX+12}" y="${OY+26}" fill="#8a8270" font-size="16">← ${L}</text><text x="${OX+100*SX-12}" y="${OY+26}" fill="#8a8270" font-size="16" text-anchor="end">${R} →</text>`;
  // その場面の道すじ
  if(cur>=0){ const sc=S[cur];
    for(const id of ["H","F","M"]){
      const pts=[]; const p0=posAt(id,sc.start); if(poseAt(id,sc.start+.5).p==="hide" && poseAt(id,sc.end-.5).p==="hide") continue;
      pts.push(disp(p0.x,p0.y));
      for(const k of ACT[id].pos) if(k.t>sc.start && k.t<=sc.end+.01) pts.push(disp(k.x,k.y));
      const uniq=pts.filter((p,i)=>i===0||Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1])>2);
      if(uniq.length<2) continue;
      const op=focusOf(id)?.55:.2;
      s+=`<polyline points="${uniq.map(p=>p.map(f1).join(",")).join(" ")}" fill="none" stroke="${ROLE[id].c}" stroke-opacity="${op}" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#ar)" stroke-linejoin="round"/>`;
    }
  }
  // 人
  const order=A.slice().sort((a,b)=>(focusOf(a.id)?1:0)-(focusOf(b.id)?1:0));
  const Mst=A.find(a=>a.id==="M");
  for(const a of order){
    const R0=ROLE[a.id], f=focusOf(a.id), op=f?1:.42;
    let X=a.X,Y=a.Y,sc=1,rot=0,extra="";
    const P=a.p, u=a.u;
    if(["jump","pyon","pyon3","hop","surprise"].includes(P)) { const per=P==="hop"?.45:.7; if(!(P==="pyon"&&u>.7)&&!(P==="pyon3"&&u>2.1)&&!(P==="surprise"&&u>.6)) { Y+= -16*ab(sn(Math.PI*u/per)); sc=1.12; } }
    if(P==="roll") rot=(u%1.2)/1.2*360;
    if(["sleep","lie"].includes(P)) extra=`<text x="34" y="-26" fill="#cfd8ff" font-size="20">z z</text>`;
    if(P==="oshichi"||P==="oshichiwalk") { sc=1.3; extra=`<text x="0" y="-44" fill="#fff" font-size="22" text-anchor="middle">⇧</text>`; }
    if(P==="crouch"||P==="sit") sc=.85;
    if(P==="thrash") X+=sn(u*30)*4;
    if((P==="ride"||P==="ridekachi") && Mst){ X=Mst.X+10; Y=Mst.Y-22; sc=.85; }
    const flat = ["sleep","lie","namlie","yame"].includes(P);
    s+=`<g transform="translate(${f1(X)},${f1(Y)}) scale(${sc})" opacity="${op}">`;
    if(f) s+=`<circle r="40" fill="none" stroke="${R0.c}" stroke-opacity=".35" stroke-width="6"/>`;
    s+=`<g transform="rotate(${f1(rot)})"><ellipse rx="30" ry="${flat?19:30}" fill="${R0.d}" stroke="${R0.c}" stroke-width="4"/>`+
       `<text y="10" fill="${R0.c}" font-size="28" text-anchor="middle" font-weight="bold">${R0.s}</text></g>${extra}</g>`;
    const lb=(a.id==="H"?LBL.H:LBL.B)[P];
    if(lb && !["walk","walk4"].includes(P) && f){
      const w=lb.length*19+20;
      const PY=(Y-58*sc<OY+24)?Y+64*sc:Y-58*sc;
      s+=`<g transform="translate(${f1(X)},${f1(PY)})"><rect x="${-w/2}" y="-20" width="${w}" height="30" rx="8" fill="#000" fill-opacity=".75" stroke="${R0.c}"/>`+
         `<text y="2" fill="#fff" font-size="19" text-anchor="middle">${esc(lb)}</text></g>`;
    }
  }
  if(!A.length) s+=`<text x="500" y="280" fill="#8a8270" font-size="24" text-anchor="middle">${t<T("6:00")?"もうすぐ場面1。狩人が出てきます":"（だれも出ていません）"}</text>`;
  mapEl.innerHTML=s;
}

function drawFig(t,A){
  const G=292; let s=`<line x1="20" y1="${G}" x2="980" y2="${G}" stroke="#3a3730" stroke-width="3"/>`;
  const list=A.filter(a=>!(a.id==="F"&&(a.p==="ride"||a.p==="ridekachi")));
  const ride=A.find(a=>a.id==="F"&&(a.p==="ride"||a.p==="ridekachi"));
  list.sort((a,b)=>a.X-b.X);
  const n=list.length, slots=n===1?[500]:n===2?[310,690]:[190,500,810];
  const slotOf={};
  list.forEach((a,i)=>{ a.SX=slots[i]; slotOf[a.id]=slots[i]; });
  if(ride){ ride.SX=slotOf.M||500; ride.ride=true; list.push(ride); }
  for(const a of list){
    const f=focusOf(a.id), R0=ROLE[a.id];
    let k, d, off=0;
    if(a.id==="H"){ k=f?1.6:.9; const p=(HP[a.p]||HP.stand)(a.u); d=drawHunter(p); }
    else {
      k=f?1.0:.6; const p=(BP[a.p]||BP.stand)(a.u); d=drawBear(p,R0.c);
      if(a.ride){ k*=.8; off=-105; }
    }
    let face=1;
    if(d.side){
      face=ACT[a.id].face;
      if(a.p==="turnout") face = a.SX<500?-1:1;
      if(a.p==="headtouch"||a.p==="poke"){ const o=list.filter(b=>b!==a); if(o.length){ const tg=a.p==="poke"?(o.find(b=>b.id==="H")||o[0]):(o.find(b=>b.id!=="H")||o[0]); face=tg.SX>a.SX?1:-1; } }
    }
    const op=f?1:.45;
    s+=`<g opacity="${op}" transform="translate(${a.SX},${G+off}) scale(${f1(face*k)},${f1(k)})">${d.svg}</g>`;
    if(!a.ride) s+=`<text x="${a.SX}" y="${G-6+22}" fill="${R0.c}" font-size="18" text-anchor="middle" font-weight="bold" opacity="${op}">${R0.s} ${R0.n}</text>`;
    if(d.bub && f){
      const by=G+off+d.top*k-14, w=d.bub.length*20+22;
      s+=`<g transform="translate(${a.SX},${f1(mx(26,by))})"><rect x="${-w/2}" y="-22" width="${w}" height="32" rx="12" fill="#fff"/>`+
         `<text y="3" fill="#111" font-size="20" text-anchor="middle" font-weight="bold">${esc(d.bub)}</text></g>`;
    }
  }
  figEl.innerHTML=s;
}

function drawCap(t){
  if(cur<0){ capEl.innerHTML=`<span class="dim">${cur===-1?"6:00 から場面1。":"動き表のあと。"}</span>`; return; }
  const sc=S[cur]; const {curK,nextK}=sceneSteps(sc,t);
  const txt=k=>roles(sc.steps[k].replace(/^!/,""));
  let h=`<b>場面${sc.n}</b>　`;
  h+= curK.length ? curK.map(txt).join("　") : `<span class="dim">（${ver==="kuma"?"熊":"狩人"}の番号はまだ）</span>`;
  if(nextK!==null){ const dt=sc.st[nextK].t-t; h+=`<br><span class="nx">つぎ → ${txt(nextK)} <span class="cd">あと${dt.toFixed(1)}秒</span></span>`; }
  else if(S[cur+1]) h+=`<br><span class="nx">つぎ → 場面${S[cur+1].n}（${S[cur+1].t}）</span>`;
  capEl.innerHTML=h;
}

  h+=`<div class="card"><h2>練習する</h2>
   <div class="note" style="margin-top:0">練習中は画面の「鳴り物」表示が消えます。動きを見て当ててください。</div>
   <div class="qbtns"><button id="qA">❓ つぎは何？（この場面から）</button><button id="qA0">❓ つぎは何？（最初から）</button></div>
   <div class="qbtns"><button id="qB">👆 タイミング（この場面から）</button><button id="qB0">👆 タイミング（最初から）</button></div>
   <div class="note">❓ 変わる2秒前に動画が止まり、このあとどうなるかを選びます。<br>👆 変わったと思った瞬間に型のボタンを押します（キーボードは数字 1〜7）。</div>
   <div class="score" id="score">${scoreHtml()}</div></div>`;
  h+=`<div class="card"><h2>きっかけ一覧 <button onclick="window.print()">印刷</button></h2><table class="cues">`;
  for(const c of CUES) h+=`<tr data-i="${c.i}" data-s="${c.s}"><td class="tt">${fmt(c.s)}</td><td>${chip(c.ty)}<br>${esc(c.why)}${c.g?"<br><span style='color:var(--sub);font-size:12px'>（終わりの時刻は目安）</span>":""}</td></tr>`;
  h+=`</table><div class="note">時刻は動画を見て決めた目安（±1秒くらい）。15:01ごろまでと15:08〜15:34は動き表に書いていないので、先生・先輩に確かめてください。</div></div>`;
  panel.innerHTML=h;
  document.getElementById("qA").onclick=()=>startQ("quiz",false);
  document.getElementById("qA0").onclick=()=>startQ("quiz",true);
  document.getElementById("qB").onclick=()=>startQ("tap",false);
  document.getElementById("qB0").onclick=()=>startQ("tap",true);
  panel.querySelectorAll("table.cues tr").forEach(r=>r.onclick=()=>{ seek(+r.dataset.s-3); });
};

// ---- 練習（クイズ／タイミング） ----
const Q={mode:null,from:0,done:new Set(),ok:0,ng:0,log:[],asking:null};
const quizEl=document.getElementById("quiz"), tpad=document.getElementById("tpad");
function scoreHtml(){
  if(!Q.log.length && !Q.mode) return "まだ練習していません。";
  const last=Q.log.slice(-6).reverse().map(x=>`<div>${x}</div>`).join("");
  return `<b>${Q.mode==="quiz"?"❓ つぎは何？":Q.mode==="tap"?"👆 タイミング":"前回"}</b>　◎○ ${Q.ok}　× ${Q.ng}${last}`;
}
function updScore(){ const el=document.getElementById("score"); if(el) el.innerHTML=scoreHtml(); }
function targets(){ return CUES.filter(c=>c.ty!=="unknown" && c.s>=Q.from-0.01); }
function nearStep(c){
  let best=null,bd=9;
  for(const s of S) s.st.forEach((e,k)=>{ const d=ab(e.t-c.s); if(d<bd && e.t<=c.s+1.5){bd=d;best={s,k};} });
  return best && bd<=3 ? `場面${best.s.n} ${roles(best.s.steps[best.k].replace(/^!/,""))}` : "";
}
function startQ(m,fromTop,idx){
  Q.mode=m; Q.done=new Set(); Q.ok=0; Q.ng=0; Q.log=[]; Q.asking=null;
  loop=false; stopEach=false; loopBtn.classList.remove("on"); stopBtn.classList.remove("on");
  const i = idx!=null ? idx : (fromTop||cur<0 ? 0 : cur);
  Q.from=S[i].start;
  seek(S[i].start-2);
  if(m==="tap") showPad("型のボタンを、変わった瞬間に押す！"); else tpad.classList.remove("show");
  quizEl.classList.remove("show");
  updScore(); v.play();
}
function stopQ(){
  if(!Q.mode) return;
  Q.log.push(`おわり：◎○ ${Q.ok}　× ${Q.ng}`);
  Q.mode=null; Q.asking=null; quizEl.classList.remove("show"); tpad.classList.remove("show"); updScore();
}
function showPad(msg){
  let h=`<div class="msg" id="tmsg">${msg}</div>`;
  QTYPES.forEach((k,i)=>h+=`<button data-tap="${k}" style="border-bottom-color:${NT[k].c}">${i+1} ${NT[k].n}</button>`);
  h+=`<button class="stopb" id="tstop">やめる</button>`;
  tpad.innerHTML=h; tpad.classList.add("show");
  tpad.querySelectorAll("[data-tap]").forEach(b=>b.onclick=()=>tap(b.dataset.tap));
  document.getElementById("tstop").onclick=stopQ;
}
function tmsg(h){ const el=document.getElementById("tmsg"); if(el) el.innerHTML=h; }
function tap(ty){
  if(Q.mode!=="tap") return;
  const t=v.currentTime+OFFSET;
  let best=null,bd=9;
  for(const c of targets()) if(!Q.done.has(c.i)){ const d=ab(t-c.s); if(d<bd){bd=d;best=c;} }
  if(!best || bd>2){ tmsg(`${chip(ty)} … まだ変わらないよ（早すぎ？）`); return; }
  Q.done.add(best.i);
  const d=t-best.s, when=d<0?"早い":"おそい";
  let r;
  if(ty!==best.ty){ r=`× 型ちがい：正解は ${chip(best.ty)}`; Q.ng++; }
  else if(ab(d)<=.6){ r=`◎ ぴったり！ ${chip(ty)}`; Q.ok++; }
  else if(ab(d)<=1.3){ r=`○ おしい（${ab(d).toFixed(1)}秒${when}） ${chip(ty)}`; Q.ok++; }
  else { r=`△ ${ab(d).toFixed(1)}秒${when} ${chip(ty)}`; Q.ng++; }
  tmsg(r+`　<span style="font-size:14px;color:#ccc">${esc(best.why)}</span>`);
  Q.log.push(`${fmt(best.s)} ${r}`); updScore();
}
function ask(c){
  Q.asking=c; v.pause();
  const nowC=cueAt(v.currentTime+OFFSET);
  let h=`<h3>❓ このあと鳴り物はどうなる？</h3><div class="hint">いま：${nowC?chip(nowC.ty):""}<br>このとき起きる動き：${nearStep(c)||"（動画を見て）"}</div><div class="ch">`;
  QTYPES.forEach((k,i)=>h+=`<button data-ans="${k}" style="border-left-color:${NT[k].c}">${i+1} ${NT[k].n}</button>`);
  h+=`</div><div class="res" id="qres"></div><div class="qbtns" style="margin-top:10px"><button id="qgo" style="display:none">つづける ▶（スペース）</button><button id="qend">やめる</button></div>`;
  quizEl.innerHTML=h; quizEl.classList.add("show");
  quizEl.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>answer(b.dataset.ans));
  document.getElementById("qgo").onclick=resumeQ;
  document.getElementById("qend").onclick=stopQ;
}
function answer(ty){
  const c=Q.asking; if(!c || Q.done.has(c.i)) return;
  Q.done.add(c.i);
  const ok=ty===c.ty;
  if(ok) Q.ok++; else Q.ng++;
  document.getElementById("qres").innerHTML = (ok?`<span class="ok">◎ 正解！</span> `:`<span class="ng">× ざんねん</span> 正解は `)+chip(c.ty)+
    `<br>${esc(c.why)}<br><span style="font-size:14px;color:var(--sub)">覚え方：${NT[c.ty].rule||""}</span>`;
  quizEl.querySelectorAll("[data-ans]").forEach(b=>{ b.disabled=true; if(b.dataset.ans===c.ty) b.style.outline="3px solid #fff"; });
  document.getElementById("qgo").style.display="";
  Q.log.push(`${fmt(c.s)} ${ok?"◎":"×"} ${NT[c.ty].n}`); updScore();
}
function resumeQ(){ Q.asking=null; quizEl.classList.remove("show"); v.play(); }
function checkQ(t){
  if(Q.mode==="quiz" && !Q.asking && !v.paused){
    const c=targets().find(c=>!Q.done.has(c.i) && c.s-t<=2 && c.s-t>-0.3);
    if(c) ask(c);
  }
  if(Q.mode==="tap"){
    for(const c of targets()) if(!Q.done.has(c.i) && t-c.s>2){ Q.done.add(c.i); Q.ng++; const r=`… 見のがし：${chip(c.ty)}`; tmsg(r+`　<span style="font-size:14px;color:#ccc">${esc(c.why)}</span>`); Q.log.push(`${fmt(c.s)} ${r}`); updScore(); }
  }
  if(Q.mode && t>=AFTER-0.2){ stopQ(); }
}
document.addEventListener("keydown",e=>{
  if(Q.mode==="tap" && /^[1-7]$/.test(e.key)){ e.preventDefault(); e.stopImmediatePropagation(); tap(QTYPES[+e.key-1]); return; }
  if(Q.mode==="quiz" && Q.asking){
    if(/^[1-7]$/.test(e.key)){ e.preventDefault(); e.stopImmediatePropagation(); answer(QTYPES[+e.key-1]); return; }
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); e.stopImmediatePropagation(); if(Q.done.has(Q.asking.i)) resumeQ(); return; }
  }
  if(e.key==="Escape" && Q.mode){ stopQ(); }
},true);

// ---- 切りかえボタン ----
const viewsEl=document.getElementById("views");
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ view=b.dataset.view; viewsEl.className="views v-"+view;
  document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on",x===b)); force=true; });
document.querySelectorAll("[data-ver]").forEach(b=>b.onclick=()=>{ ver=b.dataset.ver;
  document.querySelectorAll("[data-ver]").forEach(x=>x.classList.toggle("on",x===b)); force=true; });
document.querySelectorAll("[data-ori]").forEach(b=>b.onclick=()=>{ ori=b.dataset.ori;
  document.querySelectorAll("[data-ori]").forEach(x=>x.classList.toggle("on",x===b)); force=true; });
// URLで最初の表示を選べる（例 ?ver=kari&view=anim&ori=cam&tab=nari）
{ const P=new URLSearchParams(location.search);
  const pick=(attr,val)=>{ const b=document.querySelector(`[data-${attr}="${val}"]`); if(b) b.click(); };
  if(P.get("view")) pick("view",P.get("view")); else viewsEl.className="views v-both";
  if(P.get("ver")) pick("ver",P.get("ver"));
  if(P.get("ori")) pick("ori",P.get("ori"));
  if(P.get("tab")==="nari") setTab("nari"); else if(P.get("tab")==="all") setTab("all");
  if(P.get("t")) v.addEventListener("loadedmetadata",()=>seek(T(P.get("t"))),{once:true}); // ?t=10:45 でその時刻から
  const st=P.get("start"); // ?start=quiz / ?start=tap で、開いたらすぐ練習（#場面番号 と組み合わせ可）
  if(st==="quiz"||st==="tap") v.addEventListener("loadedmetadata",()=>setTimeout(()=>{ const h=parseInt(location.hash.slice(1),10); startQ(st,false,(h>=1&&h<=S.length)?h-1:null); },300),{once:true});
}

// ---- 毎フレーム ----
let lastT=-1, force=true, lastCur=null;
function frame(){
  const t=v.currentTime+OFFSET;
  if(t!==lastT || force || cur!==lastCur){
    lastT=t; force=false; lastCur=cur;
    if(view!=="video"){
      const A=["H","F","M"].map(id=>actorState(id,t)).filter(Boolean);
      drawMap(t,A); drawFig(t,A); drawCap(t);
    }
    drawNari(t);
    // 右の「いまの場面」で今の番号に枠
    if(cur>=0){ const ks=allCurSteps(S[cur],t); document.querySelectorAll(`#c${cur+1} li[data-i]`).forEach(li=>li.classList.toggle("now",ks.includes(+li.dataset.i))); }
    checkQ(t);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
